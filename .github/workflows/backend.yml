name: Backend and frozen contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r contracts/requirements.txt
      - run: python scripts/validate_contracts.py
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck && npm test && npm run format:check
        working-directory: backend
      - run: npm ci && npm run lint && npm test && npm run build
        working-directory: web
